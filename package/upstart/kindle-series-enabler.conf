# Kindle Series Enabler (ADR 0002): once at boot, puts this Kindle's
# marketplace back in the series grouping list if something removed it.
# A one-shot that never blocks boot, as Kindle Wireless Sync's autostart
# job is. All logic is in boot.sh on writable storage.
start on framework_ready

task
console none

script
    [ -f /var/local/kindle-series-enabler/boot.sh ] || exit 0
    exec /bin/sh /var/local/kindle-series-enabler/boot.sh
end script
