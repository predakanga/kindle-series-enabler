# Release: on a vX.Y.Z tag, check, test and package, publish a GitHub
# Release with the .kpkg, then rebuild the KPM index on GitHub Pages.
# Run it by hand (workflow_dispatch) to rebuild only the Pages site.
#
# Modelled on Kindle Wireless Sync's release workflow (its ADR 0014).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi

      - name: Take the release notes from CHANGELOG.md
        run: |
          tools/changelog-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md

      - uses: extractions/setup-just@v4
      - name: Install shellcheck and sqlite3
        run: |
          command -v shellcheck && command -v sqlite3 ||
            { sudo apt-get update && sudo apt-get install -y shellcheck sqlite3; }

      - run: just check
      - run: just test
      - run: just package
      - run: tar -tzvf target/package/kindle-series-enabler.kpkg

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/package/kindle-series-enabler.kpkg \
            --verify-tag --notes-file notes.md --title "$GITHUB_REF_NAME"

  pages:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p site
          gh api --paginate "repos/$REPO/releases" --jq '.[]' | jq -s . > releases.json
          tools/kpm-index.sh releases.json "$REPO" > site/repo.json
          latest=$(jq -r '.packages[].artifacts[0].version // [] | map(tostring) | join(".")' site/repo.json)
          sed -e "s|@INDEX_URL@|$PAGES_URL/repo.json|g" \
              -e "s|@REPO_URL@|https://github.com/$REPO|g" \
              -e "s|@VERSION@|${latest:-none yet}|g" \
              package/pages/index.html > site/index.html
          cat site/repo.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deploy
